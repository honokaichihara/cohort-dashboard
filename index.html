<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>キャンペーンコホート分析</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');
:root{--bg:#f6faf6;--bg2:#ffffff;--bg3:#edf5ed;--bd:rgba(0,0,0,.08);--bd2:rgba(0,0,0,.15);--t:#1a2e1a;--t2:#3d6b3a;--t3:#7aa876;--ac:#3cb85a;--ac2:#2a9448;--gn:#3cb85a;--yw:#d4920a;--rd:#c0392b;--tl:#1a9e7a;--pk:#8b4a7a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);font-family:'Noto Sans JP',sans-serif;font-size:13px;line-height:1.6;min-height:100vh}
.hdr{padding:16px 24px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hdr h1{font-size:16px;font-weight:700}.hdr p{font-size:10px;color:var(--t3);font-family:'DM Mono',monospace;margin-top:1px}
.filter-panel{background:var(--bg2);border-bottom:1px solid var(--bd);padding:14px 24px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.6px;font-family:'DM Mono',monospace}
select,input[type=text]{background:var(--bg3);border:1px solid var(--bd2);color:var(--t);border-radius:6px;padding:6px 10px;font-size:12px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;outline:none;min-width:160px}
select:hover,input:hover,select:focus,input:focus{border-color:var(--ac)}
.run-btn{background:var(--ac);border:none;color:#fff;border-radius:6px;padding:7px 18px;font-size:12px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;font-weight:500;white-space:nowrap;transition:opacity .15s}
.run-btn:hover{opacity:.85}
.clear-btn{background:var(--bg3);border:1px solid var(--bd2);color:var(--t2);border-radius:6px;padding:7px 14px;font-size:12px;font-family:'Noto Sans JP',sans-serif;cursor:pointer}
.clear-btn:hover{border-color:var(--rd);color:var(--rd)}
.mtog{display:flex;border:1px solid var(--bd2);border-radius:6px;overflow:hidden}
.mbtn{background:transparent;border:none;color:var(--t2);padding:6px 14px;font-size:11px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;transition:all .15s;white-space:nowrap}
.mbtn.on{background:var(--ac);color:#fff}.mbtn:not(:last-child){border-right:1px solid var(--bd2)}
.main{padding:16px 24px}
.empty-state{text-align:center;padding:60px 20px;color:var(--t3)}
.empty-state .icon{font-size:40px;margin-bottom:12px}
.empty-state p{font-size:13px}
.krow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;margin-bottom:16px}
.kc{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;position:relative;overflow:hidden}
.kc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.kc.bl::before{background:var(--ac)}.kc.gn::before{background:var(--gn)}.kc.yw::before{background:var(--yw)}.kc.tl::before{background:var(--tl)}.kc.pk::before{background:var(--pk)}.kc.pp::before{background:var(--ac2)}
.kl{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;font-family:'DM Mono',monospace;margin-bottom:4px}
.kv{font-size:22px;font-weight:700;line-height:1;font-family:'DM Mono',monospace}
.kc.bl .kv{color:var(--ac)}.kc.gn .kv{color:var(--gn)}.kc.yw .kv{color:var(--yw)}.kc.tl .kv{color:var(--tl)}.kc.pk .kv{color:var(--pk)}.kc.pp .kv{color:var(--ac2)}
.ks{font-size:9px;color:var(--t3);margin-top:2px}
.section{margin-bottom:20px}
.stit{font-size:12px;color:var(--t2);font-weight:500;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.stit::before{content:'';display:inline-block;width:3px;height:13px;background:var(--ac);border-radius:2px}
.cohort-scroll{overflow-x:auto;border-radius:10px;border:1px solid var(--bd)}
.cohort-tbl{border-collapse:collapse;min-width:100%;background:var(--bg2)}
.cohort-tbl th{background:var(--bg3);padding:8px 12px;font-size:10px;color:var(--t3);font-weight:500;text-transform:uppercase;letter-spacing:.5px;font-family:'DM Mono',monospace;white-space:nowrap;text-align:center;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd)}
.cohort-tbl th.row-hdr{text-align:left;min-width:110px}
.cohort-tbl td{padding:8px 12px;font-size:12px;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);text-align:center;font-family:'DM Mono',monospace;white-space:nowrap}
.cohort-tbl td.row-lbl{text-align:left;font-family:'Noto Sans JP',sans-serif;color:var(--t2);font-size:11px;background:var(--bg3)}
.cohort-tbl td.lead-cell{background:rgba(79,142,247,.12);color:var(--ac);font-weight:500}
.cohort-tbl td.appo-cell{color:var(--tl)}.cohort-tbl td.won-cell{color:var(--gn)}.cohort-tbl td.amt-cell{color:var(--yw)}.cohort-tbl td.rate-cell{color:var(--pk)}
.cohort-tbl td.zero{color:var(--t3)}.cohort-tbl tr:last-child td{border-bottom:none}
.heat-high{background:rgba(52,211,153,.18)!important}.heat-mid{background:rgba(52,211,153,.08)!important}
.clickable-cell{cursor:pointer}.clickable-cell:hover{opacity:.75}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
@media(max-width:820px){.cgrid{grid-column:1fr}}
.cc{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:16px}
.cc h3{font-size:11px;color:var(--t2);margin-bottom:12px;font-weight:500}
.cw{position:relative;height:220px}.cw.tall{height:280px}.cc.wide{grid-column:1/-1}
.tabs{display:flex;border-bottom:1px solid var(--bd);margin-bottom:14px;gap:0;overflow-x:auto}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--t3);padding:7px 14px 9px;font-size:12px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;margin-bottom:-1px;transition:all .15s;white-space:nowrap}
.tab:hover{color:var(--t2)}.tab.on{color:var(--ac);border-bottom-color:var(--ac)}
.pnl{display:none}.pnl.on{display:block}
.variant-area{background:var(--bg3);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:11px;color:var(--t2)}
.variant-area strong{color:var(--t);font-size:12px}
.chip{display:inline-block;background:rgba(79,142,247,.12);color:var(--ac);border:1px solid rgba(79,142,247,.25);border-radius:4px;padding:2px 8px;font-size:10px;margin:2px;font-family:'DM Mono',monospace}
.twrap{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;overflow:auto;max-height:60vh}
table.dtbl{width:100%;border-collapse:collapse;min-width:600px}
table.dtbl thead tr{background:var(--bg3);position:sticky;top:0;z-index:2}
table.dtbl th{padding:8px 11px;text-align:left;font-size:10px;color:var(--t3);font-weight:500;text-transform:uppercase;letter-spacing:.5px;font-family:'DM Mono',monospace;cursor:pointer;user-select:none;white-space:nowrap}
table.dtbl th:hover{color:var(--t2)}
table.dtbl td{padding:7px 11px;font-size:12px;border-top:1px solid var(--bd);white-space:nowrap}
table.dtbl tr:hover td{background:rgba(255,255,255,.02)}
.tn{font-family:'DM Mono',monospace;text-align:right}
.badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;font-family:'DM Mono',monospace;font-weight:500}
.bg{background:rgba(52,211,153,.15);color:var(--gn)}.by{background:rgba(251,191,36,.15);color:var(--yw)}.br{background:rgba(248,113,113,.15);color:var(--rd)}.bb{background:rgba(79,142,247,.15);color:var(--ac)}
.badge-won{background:rgba(52,211,153,.2);color:var(--gn)}.badge-lost{background:rgba(248,113,113,.2);color:var(--rd)}.badge-prog{background:rgba(34,211,238,.15);color:var(--tl)}.badge-none{background:var(--bg3);color:var(--t3)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--bd2);border-radius:14px;width:100%;max-width:1100px;display:flex;flex-direction:column;max-height:88vh;overflow:hidden}
.modal-hdr{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-shrink:0}
.modal-hdr h2{font-size:14px;font-weight:700}
.modal-close{background:var(--bg3);border:1px solid var(--bd2);color:var(--t2);border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;flex-shrink:0}
.modal-close:hover{border-color:var(--rd);color:var(--rd)}
.modal-body{padding:14px 18px;overflow-y:auto;flex:1}
.mfilters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;padding:10px 12px;background:var(--bg3);border-radius:8px}
.msearch{background:var(--bg2);border:1px solid var(--bd2);color:var(--t);border-radius:6px;padding:6px 10px;font-size:12px;font-family:'Noto Sans JP',sans-serif;outline:none;width:200px}
.msearch:focus{border-color:var(--ac)}
.contact-row{background:var(--bg3);border:1px solid var(--bd);border-radius:8px;margin-bottom:6px;overflow:hidden}
.cr-main{padding:9px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer}
.cr-main:hover{background:rgba(255,255,255,.02)}
.cr-company{font-size:13px;font-weight:500;flex:1;min-width:100px}
.cr-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.cr-toggle{font-size:11px;color:var(--t3);transition:transform .2s}
.contact-row.expanded .cr-toggle{transform:rotate(90deg)}
.cr-detail{max-height:0;overflow:hidden;transition:max-height .3s ease}
.contact-row.expanded .cr-detail{max-height:800px}
.cr-detail-inner{padding:0 14px 14px}
.deal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin-top:8px}
.deal-card{background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:10px 12px}
.deal-card.won{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.04)}
.deal-card.lost{border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.04)}
.deal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.deal-fields{font-size:11px;color:var(--t2);line-height:1.9}.deal-fields span{color:var(--t)}
.hs-link{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--ac);text-decoration:none;border:1px solid rgba(79,142,247,.3);border-radius:4px;padding:2px 7px;font-family:'DM Mono',monospace}
.hs-link:hover{background:rgba(79,142,247,.12)}
.pagination{display:flex;align-items:center;justify-content:space-between;padding:10px 0 2px;font-size:11px;color:var(--t3)}
.page-btns{display:flex;gap:4px;flex-wrap:wrap}
.page-btn{background:var(--bg3);border:1px solid var(--bd2);color:var(--t2);border-radius:4px;padding:4px 9px;font-size:11px;cursor:pointer}
.page-btn:hover,.page-btn.on{background:var(--ac);color:#fff;border-color:var(--ac)}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}
</style>
</head>
<body>
<div class="hdr">
  <div>
    <h1>📊 キャンペーンコホート分析</h1>
    <p>展示会・セミナーのリード群がその後どう転換したかを月別に追跡</p>
  </div>
  <div class="mtog">
    <button class="mbtn on" id="btn-v1" onclick="setView(1)">① リード起点</button>
    <button class="mbtn"    id="btn-v2" onclick="setView(2)">② アポ前接触起点</button>
  </div>
</div>
<div class="filter-panel">
  <div class="fg">
    <label>大枠キャンペーン</label>
    <select id="f-seg-base"><option value="">-- 選択してください --</option></select>
  </div>
  <div class="fg" id="fg-source">
    <label>リードソース（B列）</label>
    <select id="f-source"><option value="">すべて</option></select>
  </div>
  <div class="fg" id="fg-lead-month">
    <label>リード作成月（C列）</label>
    <select id="f-lead-month"><option value="">すべて</option></select>
  </div>
  <button class="run-btn" onclick="runAnalysis()">▶ 分析実行</button>
  <button class="clear-btn" onclick="clearAll()">リセット</button>
</div>
<div class="main">
  <div class="empty-state" id="empty-state">
    <div class="icon">🎯</div>
    <p>上のフィルターでキャンペーンを選択して「分析実行」を押してください</p>
  </div>
  <div id="result" style="display:none">
    <div class="variant-area" id="variant-area"></div>
    <div class="krow" id="krow"></div>
    <div class="tabs">
      <button class="tab on" onclick="showTab('cohort',this)">コホートテーブル</button>
      <button class="tab"    onclick="showTab('trend',this)">月別トレンド</button>
      <button class="tab"    onclick="showTab('owner',this)">担当者別</button>
      <button class="tab"    onclick="showTab('lost',this)">失注分析</button>
      <button class="tab"    onclick="showTab('contacts',this)">コンタクト一覧</button>
    </div>
    <div class="pnl on" id="pnl-cohort">
      <div class="section">
        <div class="stit" id="cohort-title">月別コホート推移</div>
        <div class="cohort-scroll" id="cohort-wrap"></div>
      </div>
    </div>
    <div class="pnl" id="pnl-trend">
      <div class="cgrid">
        <div class="cc wide"><h3>月別 アポ数・受注数の推移</h3><div class="cw tall"><canvas id="chart-trend"></canvas></div></div>
        <div class="cc wide"><h3>月別 受注金額</h3><div class="cw"><canvas id="chart-trend-amt"></canvas></div></div>
      </div>
    </div>
    <div class="pnl" id="pnl-owner">
      <div class="cgrid">
        <div class="cc"><h3>担当者別 アポ数・受注数</h3><div class="cw tall"><canvas id="chart-owner"></canvas></div></div>
        <div class="cc"><h3>担当者別 受注金額</h3><div class="cw tall"><canvas id="chart-owner-amt"></canvas></div></div>
        <div class="cc wide"><h3>担当者別 詳細</h3>
          <div class="twrap"><table class="dtbl"><thead><tr>
            <th onclick="sortOwner('name')">担当者</th>
            <th onclick="sortOwner('appo')" class="tn">アポ数</th>
            <th onclick="sortOwner('won')" class="tn">受注数</th>
            <th onclick="sortOwner('wonRate')" class="tn">受注率</th>
            <th onclick="sortOwner('amount')" class="tn">受注金額</th>
            <th onclick="sortOwner('cpa')" class="tn">平均単価</th>
          </tr></thead><tbody id="owner-tbl"></tbody></table></div>
        </div>
      </div>
    </div>
    <div class="pnl" id="pnl-lost">
      <div class="cgrid">
        <div class="cc"><h3>失注理由 内訳</h3><div class="cw"><canvas id="chart-lost-pie"></canvas></div></div>
        <div class="cc"><h3>月別 失注理由 推移</h3><div class="cw"><canvas id="chart-lost-trend"></canvas></div></div>
      </div>
    </div>
    <div class="pnl" id="pnl-contacts">
      <div class="mfilters" style="border-radius:8px;margin-bottom:12px">
        <input class="msearch" id="contact-search" type="text" placeholder="会社名・担当者で検索..." oninput="filterContactsList()">
        <select id="contact-status-filter" onchange="filterContactsList()" style="font-size:11px;padding:4px 8px;min-width:130px">
          <option value="all">全ステータス</option>
          <option value="won">受注のみ</option>
          <option value="appo">アポあり</option>
          <option value="lost">失注あり</option>
          <option value="none">アポなし</option>
        </select>
        <span id="contact-count" style="font-size:11px;color:var(--t3);margin-left:auto"></span>
      </div>
      <div id="contact-list"></div>
      <div class="pagination" id="contact-pagination"></div>
    </div>
  </div>
</div>
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-hdr">
      <div><h2 id="modal-title"></h2><div style="font-size:10px;color:var(--t3);margin-top:2px" id="modal-sub"></div></div>
      <button class="modal-close" onclick="closeModal()">✕ 閉じる</button>
    </div>
    <div class="modal-body" id="modal-body">
      <div class="mfilters">
        <input class="msearch" id="modal-search" type="text" placeholder="会社名で検索..." oninput="filterModal()">
        <span id="modal-count" style="font-size:11px;color:var(--t3);margin-left:auto"></span>
      </div>
      <div id="modal-contacts"></div>
      <div class="pagination" id="modal-pagination"></div>
    </div>
  </div>
</div>

function fmtN(n){if(n>=100000000)return(n/100000000).toFixed(1)+'億';if(n>=10000)return Math.round(n/10000)+'万';return n.toLocaleString();}
function extractBase(seg){const s=seg.replace(/【キャンペーン】/g,'').trim();return s.split(' ')[0].replace(/_+$/,'');}

function setView(v){
  currentView=v;
  document.getElementById('btn-v1').classList.toggle('on',v===1);
  document.getElementById('btn-v2').classList.toggle('on',v===2);
  document.getElementById('fg-source').style.display=v===1?'':'none';
  document.getElementById('fg-lead-month').style.display=v===1?'':'none';
  if(currentResult) runAnalysis();
}

function runAnalysis(){
  const segBase=document.getElementById('f-seg-base').value;
  if(!segBase){alert('キャンペーンを選択してください');return;}
  const srcFilter=currentView===1?document.getElementById('f-source').value:'';
  const mthFilter=currentView===1?document.getElementById('f-lead-month').value:'';
  const variants=META.all_segs[segBase]||[];
  let filtered;
  if(currentView===1){
    filtered=COHORT_CONTACTS.filter(c=>{
      if(!c.sb.includes(segBase)) return false;
      if(srcFilter && c.ls!==srcFilter) return false;
      if(mthFilter && c.lym!==mthFilter) return false;
      return true;
    });
  } else {
    filtered=COHORT_CONTACTS.filter(c=>
      c.dl.some(d=>{
        const pBases=d.pc.split(',').map(s=>extractBase(s.trim())).filter(Boolean);
        return pBases.includes(segBase);
      })
    );
  }
  currentContacts=filtered;
  currentResult=aggregateCohort(filtered,segBase,currentView);
  currentResult.variants=variants;
  currentResult.segBase=segBase;
  document.getElementById('empty-state').style.display='none';
  document.getElementById('result').style.display='block';
  renderAll();
}

function aggregateCohort(contacts,segBase,view){
  const leads={},appo={},won={},amount={},lost={},ownerMap={};
  contacts.forEach(c=>{
    if(view===1 && c.lym) leads[c.lym]=(leads[c.lym]||0)+1;
    const deals=view===1?c.dl:c.dl.filter(d=>{
      const pBases=d.pc.split(',').map(s=>extractBase(s.trim())).filter(Boolean);
      return pBases.includes(segBase);
    });
    deals.forEach(d=>{
      const ym=d.dym;if(!ym)return;
      appo[ym]=(appo[ym]||0)+1;
      if(d.iw){won[ym]=(won[ym]||0)+1;amount[ym]=(amount[ym]||0)+d.am;}
      if(d.il){if(!lost[ym])lost[ym]={};lost[ym][d.st]=(lost[ym][d.st]||0)+1;}
      const cr=d.cr||'不明';
      if(!ownerMap[cr])ownerMap[cr]={appo:0,won:0,amount:0};
      ownerMap[cr].appo++;
      if(d.iw){ownerMap[cr].won++;ownerMap[cr].amount+=d.am;}
    });
  });
  return{leads,appo,won,amount,lost,ownerMap,totalLeads:contacts.length};
}

  renderVariants();renderKPI();

  if(active?.id==='pnl-trend')    renderTrend();
  if(active?.id==='pnl-owner')    renderOwner();
  if(active?.id==='pnl-lost')     renderLost();
  if(active?.id==='pnl-contacts') renderContactList();
}

}

  const r=currentResult;
  const tA=Object.values(r.appo).reduce((s,n)=>s+n,0);
  const tW=Object.values(r.won ).reduce((s,n)=>s+n,0);
  const tAmt=Object.values(r.amount).reduce((s,n)=>s+n,0);
  const ar=r.totalLeads>0?(tA/r.totalLeads*100).toFixed(1):0;
  const wr=tA>0?(tW/tA*100).toFixed(1):0;
  document.getElementById('krow').innerHTML=[
    {c:'bl',l:'リード数',v:r.totalLeads.toLocaleString(),s:'対象コンタクト'},
    {c:'tl',l:'アポ数（累計）',v:tA.toLocaleString(),s:'転換率 '+(ar)+'%'},
    {c:'gn',l:'受注数（累計）',v:tW.toLocaleString(),s:'アポ→受注 '+(wr)+'%'},
    {c:'yw',l:'受注金額（累計）',v:'¥'+fmtN(tAmt),s:'計上ベース'},
    {c:'pk',l:'平均受注単価',v:tW>0?'¥'+fmtN(Math.round(tAmt/tW)):'-',s:''},
    {c:'pp',l:'リード→受注率',v:r.totalLeads>0?(tW/r.totalLeads*100).toFixed(1)+'%':'-',s:''},
  ].map(c=>'<div class="kc '+(c.c)+'"><div class="kl">'+(c.l)+'</div><div class="kv">'+(c.v)+'</div><div class="ks">'+(c.s)+'</div></div>').join('');
}

function renderCohort(){
  const r=currentResult;
  const allYms=new Set([...Object.keys(r.leads),...Object.keys(r.appo),...Object.keys(r.won)]);
  const months=[...allYms].sort();
  if(!months.length){document.getElementById('cohort-wrap').innerHTML='<p style="color:var(--t3);padding:16px">データなし</p>';return;}
  const thCols=months.map(m=>'<th>'+(m.replace('-','年'))+'月</th>').join('');
  const maxAppo=Math.max(...months.map(m=>r.appo[m]||0),1);
  function cell(val,cls,clickable,ym,type){
    if(!val&&val!==0)return'<td class="zero">-</td>';
    if(!val)return'<td class="zero">-</td>';
    const heat=val/maxAppo>=0.5?'heat-high':val/maxAppo>=0.2?'heat-mid':'';
    if(clickable&&val>0){
      return'<td class="'+(cls)+' '+(heat)+' clickable-cell" onclick="openCohortModal(\''+(ym)+'\',\''+(type)+'\')" title="クリックで詳細">'+(val)+'</td>';
    }
    return'<td class="'+(cls)+' '+(heat)+'">'+(val||'-')+'</td>';
  }
  const rowDefs=[
    {label:'リード獲得数',key:'leads',cls:'lead-cell',cl:false},
    {label:'アポ取得数',key:'appo',cls:'appo-cell',cl:true,type:'appo'},
    {label:'受注数',key:'won',cls:'won-cell',cl:true,type:'won'},
    {label:'アポ転換率',key:'ar',cls:'rate-cell',cl:false},
    {label:'受注金額',key:'amt',cls:'amt-cell',cl:false},
    {label:'累計受注金額',key:'cumamt',cls:'amt-cell',cl:false},
  ];
  let cumAmt=0;
  const rowsHtml=rowDefs.map(row=>{
    const cells=months.map(m=>{
      if(row.key==='leads') return cell(r.leads[m]||0,row.cls,false,m,'');
      if(row.key==='appo')  return cell(r.appo[m]||0,row.cls,row.cl,m,row.type);
      if(row.key==='won')   return cell(r.won[m]||0,row.cls,row.cl,m,row.type);
      if(row.key==='ar'){
        const l=r.leads[m]||0,a=r.appo[m]||0;
        const v=l>0?(a/l*100).toFixed(0)+'%':a>0?'(-)':'';
        return v?'<td class="'+(row.cls)+'">'+(v)+'</td>':'<td class="zero">-</td>';
      }
      if(row.key==='amt'){
        const v=r.amount[m]||0;
        return v>0?'<td class="'+(row.cls)+'">¥'+(fmtN(v))+'</td>':'<td class="zero">-</td>';
      }
      if(row.key==='cumamt'){
        cumAmt+=(r.amount[m]||0);
        return cumAmt>0?'<td class="'+(row.cls)+'">¥'+(fmtN(cumAmt))+'</td>':'<td class="zero">-</td>';
      }
      return '<td>-</td>';
    }).join('');
    return'<tr><td class="row-lbl">'+(row.label)+'</td>'+(cells)+'</tr>';
  }).join('');
  document.getElementById('cohort-wrap').innerHTML='<table class="cohort-tbl"><thead><tr><th class="row-hdr">指標 ╲ 月</th>'+(thCols)+'</tr></thead><tbody>'+(rowsHtml)+'</tbody></table>';
  document.getElementById('cohort-title').textContent=currentView===1
    ?'コホートテーブル（リード起点：アポ・受注は実際の月）'
    :'コホートテーブル（アポ前接触起点：商談作成月ベース）';
}

function renderTrend(){
  const r=currentResult;
  const months=[...new Set([...Object.keys(r.appo),...Object.keys(r.won)])].sort();
  const labels=months.map(m=>m.replace('-','年')+'月');
  mkChart('chart-trend',{type:'line',data:{labels,datasets:[
    {label:'アポ数',data:months.map(m=>r.appo[m]||0),borderColor:'#22d3ee',backgroundColor:'#22d3ee22',tension:.3,fill:true,pointRadius:4},
    {label:'受注数',data:months.map(m=>r.won[m]||0),borderColor:'#34d399',tension:.3,pointRadius:4},
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:10}}},
    scales:{x:{grid:{color:'rgba(255,255,255,.04)'}},y:{grid:{color:'rgba(255,255,255,.04)'},beginAtZero:true}}}});
  mkChart('chart-trend-amt',{type:'bar',data:{labels,datasets:[
    {label:'受注金額',data:months.map(m=>r.amount[m]||0),backgroundColor:'#fbbf2444',borderColor:'#fbbf24',borderWidth:1}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
    scales:{x:{grid:{color:'rgba(255,255,255,.04)'}},y:{grid:{color:'rgba(255,255,255,.04)'},ticks:{callback:v=>'¥'+fmtN(v)},beginAtZero:true}}}});
}

function renderOwner(){
  const r=currentResult;
  let owners=Object.entries(r.ownerMap).map(([name,d])=>({name,...d,wonRate:d.appo>0?d.won/d.appo*100:0,cpa:d.won>0?d.amount/d.won:0})).filter(d=>d.appo>0).sort((a,b)=>(b[sortOwnerCfg.key]||0)-(a[sortOwnerCfg.key]||0));
  const top=owners.slice(0,10),labels=top.map(d=>d.name.length>8?d.name.slice(0,8)+'…':d.name);
  mkChart('chart-owner',{type:'bar',data:{labels,datasets:[
    {label:'アポ数',data:top.map(d=>d.appo),backgroundColor:'#22d3ee44',borderColor:'#22d3ee',borderWidth:1},
    {label:'受注数',data:top.map(d=>d.won),backgroundColor:'#34d39988',borderColor:'#34d399',borderWidth:1},
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:10}}},
    scales:{x:{grid:{color:'rgba(255,255,255,.04)'},ticks:{font:{size:10}}},y:{grid:{color:'rgba(255,255,255,.04)'},beginAtZero:true}}}});
  mkChart('chart-owner-amt',{type:'bar',data:{labels,datasets:[
    {label:'受注金額',data:top.map(d=>d.amount),backgroundColor:'#fbbf2455',borderColor:'#fbbf24',borderWidth:1}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
    scales:{x:{grid:{color:'rgba(255,255,255,.04)'},ticks:{font:{size:10}}},y:{grid:{color:'rgba(255,255,255,.04)'},ticks:{callback:v=>'¥'+fmtN(v)},beginAtZero:true}}}});
  function rb(v){const c=v>=40?'bg':v>=20?'by':'br';return'<span class="badge '+(c)+'">'+(v.toFixed(1))+'%</span>';}
  document.getElementById('owner-tbl').innerHTML=owners.map(d=>
    '<tr><td>'+(d.name)+'</td><td class="tn">'+(d.appo)+'</td><td class="tn">'+(d.won)+'</td><td class="tn">'+(rb(d.wonRate))+'</td><td class="tn">'+(d.amount>0?'¥'+d.amount.toLocaleString():'-')+'</td><td class="tn">'+(d.cpa>0?'¥'+fmtN(Math.round(d.cpa)):'-')+'</td></tr>'
  ).join('');
}
function sortOwner(key){sortOwnerCfg=sortOwnerCfg.key===key?{key,dir:sortOwnerCfg.dir*-1}:{key,dir:-1};renderOwner();}

function renderLost(){
  const r=currentResult;
  const reasons=Object.keys(COHORT_LC);
  const totals={};
  Object.values(r.lost).forEach(m=>Object.entries(m).forEach(([k,v])=>{totals[k]=(totals[k]||0)+v;}));
  mkChart('chart-lost-pie',{type:'doughnut',data:{labels:reasons.map(r=>r.replace('失注（','').replace('）','')),
    datasets:[{data:reasons.map(r=>totals[r]||0),backgroundColor:reasons.map(r=>COHORT_LC[r]+'aa'),borderColor:reasons.map(r=>COHORT_LC[r]),borderWidth:1}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{boxWidth:10,font:{size:10},padding:8}}}}});
  const months=Object.keys(r.lost).sort();
  mkChart('chart-lost-trend',{type:'bar',data:{labels:months.map(m=>m.replace('-','年')+'月'),
    datasets:reasons.map(rr=>({label:rr.replace('失注（','').replace('）',''),data:months.map(m=>(r.lost[m]||{})[rr]||0),backgroundColor:COHORT_LC[rr]+'77',borderColor:COHORT_LC[rr],borderWidth:1}))},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:8,font:{size:10}}}},
      scales:{x:{stacked:true,grid:{color:'rgba(255,255,255,.04)'},ticks:{font:{size:10}}},y:{stacked:true,grid:{color:'rgba(255,255,255,.04)'},beginAtZero:true}}}});
}

function renderContactList(){
  cListFiltered=[...currentContacts];cListPage=0;
  document.getElementById('contact-search').value='';
  document.getElementById('contact-status-filter').value='all';
  document.getElementById('contact-count').textContent=cListFiltered.length+'件';
  renderContactListPage();
}
function filterContactsList(){
  const q=document.getElementById('contact-search').value.toLowerCase();
  const st=document.getElementById('contact-status-filter').value;
  cListFiltered=currentContacts.filter(c=>{
    if(q&&!c.co.toLowerCase().includes(q)&&!c.dl.some(d=>d.cr.toLowerCase().includes(q))) return false;
    if(st==='won') return c.dl.some(d=>d.iw);
    if(st==='appo') return c.dl.length>0;
    if(st==='lost') return c.dl.some(d=>d.il);
    if(st==='none') return c.dl.length===0;
    return true;
  });
  cListPage=0;
  document.getElementById('contact-count').textContent=cListFiltered.length+'件';
  renderContactListPage();
}
function renderContactListPage(){
  const start=cListPage*COHORT_PS,page=cListFiltered.slice(start,start+COHORT_PS);
  document.getElementById('contact-list').innerHTML=buildContactRows(page,start,'cl');
  buildPagination('contact-pagination',cListFiltered.length,cListPage,p=>{cListPage=p;renderContactListPage();});
}

function openCohortModal(ym,type){
  const filtered=currentContacts.filter(c=>c.dl.some(d=>d.dym===ym&&(type==='appo'||d.iw)));
  document.getElementById('modal-title').textContent=(ym.replace('-','年'))+'月 - '+(type==='appo'?'アポ取得':'受注')+'コンタクト';
  document.getElementById('modal-sub').textContent=(filtered.length)+'件 ／ '+(currentResult.segBase);
  modalContacts=filtered;modalFiltered=[...filtered];modalPage=0;
  document.getElementById('modal-search').value='';
  document.getElementById('modal-count').textContent=filtered.length+'件';
  document.getElementById('modal-bg').classList.add('open');
  document.body.style.overflow='hidden';
  renderModal();
}
function filterModal(){
  const q=document.getElementById('modal-search').value.toLowerCase();
  modalFiltered=modalContacts.filter(c=>!q||c.co.toLowerCase().includes(q));
  modalPage=0;document.getElementById('modal-count').textContent=modalFiltered.length+'件';renderModal();
}
function renderModal(){
  const start=modalPage*COHORT_PS,page=modalFiltered.slice(start,start+COHORT_PS);
  document.getElementById('modal-contacts').innerHTML=buildContactRows(page,start,'mo');
  buildPagination('modal-pagination',modalFiltered.length,modalPage,p=>{modalPage=p;renderModal();});
}
function closeModal(){document.getElementById('modal-bg').classList.remove('open');document.body.style.overflow='';}

function buildContactRows(page,start,prefix){
  return page.map((c,idx)=>{
    const gi=start+idx;
    const hasWon=c.dl.some(d=>d.iw),hasAppo=c.dl.length>0;
    const sb=hasWon?'<span class="badge badge-won">受注</span>':hasAppo?'<span class="badge badge-prog">アポあり</span>':'<span class="badge badge-none">リードのみ</span>';
    const wa=c.dl.reduce((s,d)=>s+(d.iw?d.am:0),0);
    const hsC=c.ci?'<a href="'+(COHORT_HS_C)+(c.ci)+'" target="_blank" class="hs-link">🔗 コンタクト</a>':'';
    const dealsHtml=c.dl.map(d=>{
      const cls=d.iw?'won':d.il?'lost':'';
      const sb2=d.iw?'<span class="badge badge-won">受注 S</span>':d.il?'<span class="badge badge-lost">'+(d.st)+'</span>':'<span class="badge badge-prog">'+(d.st)+'</span>';
      const hsD=d.rid?'<a href="'+(COHORT_HS_D)+(d.rid)+'" target="_blank" class="hs-link">🔗 取引</a>':'';
      return'<div class="deal-card '+(cls)+'"><div class="deal-top">'+(sb2)+'<div>'+(hsD)+'</div></div>'+
        '<div class="deal-fields">'+(d.am>0?('金額：<span>¥'+(d.am.toLocaleString())+'</span><br>'):'')+(d.cr?('担当者：<span>'+(d.cr)+'</span><br>'):'')+(d.cd?('商談作成：<span>'+(d.cd)+'</span><br>'):'')+(d.pc?('商談前キャンペーン：<span style="font-size:10px">'+(d.pc)+'</span>'):'')+'</div></div>';
    }).join('');
    return'<div class="contact-row" id="'+(prefix)+'-'+(gi)+'">'+
      '<div class="cr-main" onclick="toggleCR(\''+(prefix)+'-'+(gi)+'\')">'+
        '<div class="cr-company">'+(c.co||'（会社名なし）')+'</div>'+
        '<div class="cr-meta">'+(sb)+(wa>0?('<span style="font-family:\'DM Mono\',monospace;color:var(--gn);font-size:11px">¥'+(wa.toLocaleString())+'</span>'):'')+'<span style="font-size:10px;color:var(--t3)">'+(c.lym)+'</span>'+(hsC)+'</div>'+
        '<span class="cr-toggle">▶</span>'+
      '</div>'+
      '<div class="cr-detail"><div class="cr-detail-inner">'+
        '<div style="font-size:11px;color:var(--t3);margin-bottom:8px">Segment：<span style="color:var(--t2)">'+((c.seg||[]).join(', '))+'</span></div>'+
        (c.dl.length>0?('<div style="font-size:10px;color:var(--t3);margin-bottom:6px">商談 '+(c.dl.length)+'件</div><div class="deal-grid">'+(dealsHtml)+'</div>'):'<div style="font-size:11px;color:var(--t3)">商談なし</div>')+
      '</div></div>'+
    '</div>';
  }).join('');
}
function toggleCR(id){document.getElementById(id)?.classList.toggle('expanded');}
function buildPagination(id,total,page,onPage){
  const tp=Math.ceil(total/COHORT_PS);if(tp<=1){document.getElementById(id).innerHTML='';return;}
  const pages=[];for(let i=0;i<Math.min(tp,20);i++)pages.push('<button class="page-btn '+(i===page?'on':'')+'" onclick="('+(onPage)+')('+(i)+')">'+(i+1)+'</button>');
  document.getElementById(id).innerHTML='<span>'+(page*COHORT_PS+1)+'-'+(Math.min((page+1)*COHORT_PS,total))+' / '+(total)+'件</span><div class="page-btns">'+(pages.join(''))+'</div>';
}
function mkChart(id,cfg){const el=document.getElementById(id);if(!el)return;if(cohortCharts[id])cohortCharts[id].destroy();Chart.defaults.color='#8890a4';Chart.defaults.font={family:"'Noto Sans JP',sans-serif",size:11};cohortCharts[id]=new Chart(el,cfg);}
function showTab(name,el){
  document.querySelectorAll('.pnl').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.getElementById('pnl-'+name).classList.add('on');el.classList.add('on');
  if(!currentResult)return;
  if(name==='cohort')   renderCohort();
  if(name==='trend')    renderTrend();
  if(name==='owner')    renderOwner();
  if(name==='lost')     renderLost();
  if(name==='contacts') renderContactList();
}
function clearAll(){
  document.getElementById('f-seg-base').value='';
  currentResult=null;currentContacts=[];
  document.getElementById('empty-state').style.display='block';
  document.getElementById('result').style.display='none';
}
setView(1);initFilters();
</script>
</body>
</html>
